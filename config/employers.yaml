# Tracked employers. Add or remove an employer here; no code change needed.
#
# Common keys:
#   name, segment     shown in outputs
#   ats               adapter: workday | sfcareer | prospective | htmllist | oracle | greenhouse | lever | ashby |
#                     personio | smartrecruiters | manual.  "unknown" / "blocked" = not fetched (listed in README).
#   fetch_abroad      also keep non-Swiss postings whose title matches a family (for the offshoring flag)
#   default_country   CH for Swiss-only boards whose postings may lack a country
#   agency            true if every posting is via a staffing agency
#   note              why an employer isn't covered / anything odd
#
# Adapter keys:
#   workday:      tenant, wd (wd1/wd3/wd5...), site            -> {tenant}.{wd}.myworkdayjobs.com/{site}
#   sfcareer:     base (SuccessFactors career site root, e.g. https://careers.ey.com/ey)
#   prospective:  medium_id (from ohws.prospective.ch/public/v1/medium/{id})
#   htmllist:     listing (url or list), link_pattern (regex on hrefs), prefilter (title match on link text)
#   oracle:       host, site (URL code), site_number
#   greenhouse / lever / ashby / personio / smartrecruiters: token

employers:
  # --- Big Four assurance ---------------------------------------------------------------------
  - name: EY
    segment: big-four
    ats: sfcareer
    base: https://careers.ey.com/ey
  - name: PwC
    segment: big-four
    ats: workday
    tenant: pwc
    wd: wd3
    site: Global_Experienced_Careers
  - name: KPMG
    segment: big-four
    ats: htmllist
    listing: https://recruitingapp-2791.umantis.com/Jobs/All
    link_pattern: /Vacancies/\d+/Description/
    prefilter: true
    default_country: CH
    note: umantis board, no structured data on posting pages
  - name: Deloitte
    segment: big-four
    ats: unknown
    note: careers site renders jobs client-side; ATS not identified yet

  # --- Insurers -------------------------------------------------------------------------------
