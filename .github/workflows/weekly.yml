name: weekly

on:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Tests
        run: uv run pytest -q

      - name: Fetch and render
        run: uv run jobwatch run

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md csv data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Weekly run"
            uv run jobwatch check --min-share 0 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open issues for sources failing two weeks running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run jobwatch failing | while read -r source; do
            [ -z "$source" ] && continue
            title="Source failing two weeks running: $source"
            if ! gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body "The **$source** adapter failed in the last two weekly runs. See \`data/source_status.csv\` for the error."
            fi
          done

      - name: Fail if fewer than half the sources returned data
        run: uv run jobwatch check
