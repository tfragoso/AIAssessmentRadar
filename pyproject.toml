[project]
name = "jobwatch"
version = "0.1.0"
description = "Weekly monitor of Swiss AI validation, model risk and AI evaluation jobs"
readme = "README.md"
authors = [
    { name = "Tiago Fragoso" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
]

[project.scripts]
jobwatch = "jobwatch:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
